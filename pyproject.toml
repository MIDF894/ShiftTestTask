[project]
name = "shifttestex"
version = "0.1.0"
description = ""
authors = [
    {name = "Vadim",email = "vadim.a.mudarisov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.139.0,<0.140.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.14.0,<3.0.0)"
]

[tool.fastapi]         
entrypoint = "shifttestex.app.main:app"

[tool.poetry]
packages = [{include = "shifttestex", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]